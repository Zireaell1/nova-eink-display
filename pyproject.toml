[project]
name = "nova-eink-display"
version = "0.1.0"
description = "Python script to manage a Waveshare e-ink display for my homelab server"
readme = "README.md"
authors = [
    { name = "Zireaell1", email = "51866727+Zireaell1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow==12.3.0",
    "requests==2.34.2",
]

[project.scripts]
nova-eink-display = "nova_eink_display.main:main"

[project.optional-dependencies]
rpi = [
    "gpiozero==2.0.1 ; sys_platform == 'linux'",
    "lgpio==0.2.2.0 ; sys_platform == 'linux'",
    "spidev==3.8 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.2",
]

[tool.ruff.lint]
extend-select = ["I"]
